name: Provider — Payments API (BDCT)

on:
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'services/payments-api/**'
      - '.github/workflows/provider-payments.yml'
  workflow_dispatch:

env:
  PACT_BROKER_BASE_URL: https://smart-bank.pactflow.io
  PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}

jobs:
  self-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: services/payments-api
        run: npm install

      - name: Run BDCT self-verification
        working-directory: services/payments-api
        run: npm run test:bdct
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Publish provider contract to PactFlow (BDCT)
        run: |
          docker run --rm \
            -e PACT_BROKER_BASE_URL \
            -e PACT_BROKER_TOKEN \
            -v "$GITHUB_WORKSPACE:/workspace" \
            pactfoundation/pact-cli:latest \
            pactflow publish-provider-contract \
              /workspace/services/payments-api/openapi/payments-api.yml \
              --provider "ing-payments-api" \
              --provider-app-version "${{ github.sha }}" \
              --branch "${{ github.ref_name }}" \
              --content-type application/yaml \
              --verification-results /workspace/services/payments-api/verification-results.json \
              --verification-results-content-type application/json \
              --verifier jest \
              --verification-exit-code 0

  can-i-deploy:
    runs-on: ubuntu-latest
    needs: self-verify
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pact-node CLI
        run: npm install -g @pact-foundation/pact-node

      - name: Can I deploy?
        run: |
          npx pact-broker can-i-deploy \
            --pacticipant "ing-payments-api" \
            --version "${{ github.sha }}" \
            --to-environment production \
            --broker-base-url "$PACT_BROKER_BASE_URL" \
            --broker-token "$PACT_BROKER_TOKEN"

  record-deployment:
    runs-on: ubuntu-latest
    needs: can-i-deploy
    if: github.ref_name == 'main'
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pact-node CLI
        run: npm install -g @pact-foundation/pact-node

      - name: Record deployment
        run: |
          npx pact-broker record-deployment \
            --pacticipant "ing-payments-api" \
            --version "${{ github.sha }}" \
            --environment production \
            --broker-base-url "$PACT_BROKER_BASE_URL" \
            --broker-token "$PACT_BROKER_TOKEN"
