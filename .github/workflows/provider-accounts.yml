name: Provider — Accounts API

on:
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'services/accounts-api/**'
      - '.github/workflows/provider-accounts.yml'
  workflow_dispatch:

env:
  PACT_BROKER_BASE_URL: https://smart-bank.pactflow.io
  PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: services/accounts-api
        run: npm install

      - name: Run provider verification
        working-directory: services/accounts-api
        run: npm run test:pact
        env:
          PACT_BROKER_PUBLISH_VERIFICATION_RESULTS: 'true'
          PACT_BROKER_BASE_URL: ${{ env.PACT_BROKER_BASE_URL }}
          PACT_BROKER_TOKEN: ${{ env.PACT_BROKER_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

  can-i-deploy:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pact-node CLI
        run: npm install -g @pact-foundation/pact-node

      - name: Can I deploy?
        run: |
          npx pact-broker can-i-deploy \
            --pacticipant "ing-accounts-api" \
            --version "${{ github.sha }}" \
            --to-environment production \
            --broker-base-url "$PACT_BROKER_BASE_URL" \
            --broker-token "$PACT_BROKER_TOKEN"

  record-deployment:
    runs-on: ubuntu-latest
    needs: can-i-deploy
    if: github.ref_name == 'main'
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pact-node CLI
        run: npm install -g @pact-foundation/pact-node

      - name: Record deployment
        run: |
          npx pact-broker record-deployment \
            --pacticipant "ing-accounts-api" \
            --version "${{ github.sha }}" \
            --environment production \
            --broker-base-url "$PACT_BROKER_BASE_URL" \
            --broker-token "$PACT_BROKER_TOKEN"
