name: Consumer — Payments

on:
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'consumers/payments-mobile-consumer/**'
      - '.github/workflows/consumer-payments.yml'
  workflow_dispatch:

env:
  PACT_BROKER_BASE_URL: https://smart-bank.pactflow.io
  PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: consumers/payments-mobile-consumer
        run: npm install

      - name: Run consumer pact tests
        working-directory: consumers/payments-mobile-consumer
        run: npm test

      - name: Install pact-node CLI
        run: npm install -g @pact-foundation/pact-node

      - name: Publish pact to PactFlow
        working-directory: consumers/payments-mobile-consumer
        run: |
          npx pact-broker publish pacts \
            --consumer-app-version "${{ github.sha }}" \
            --branch "${{ github.ref_name }}" \
            --broker-base-url "$PACT_BROKER_BASE_URL" \
            --broker-token "$PACT_BROKER_TOKEN"

  can-i-deploy:
    runs-on: ubuntu-latest
    needs: test-and-publish
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pact-node CLI
        run: npm install -g @pact-foundation/pact-node

      - name: Can I deploy?
        run: |
          npx pact-broker can-i-deploy \
            --pacticipant "ing-payments-mobile-consumer" \
            --version "${{ github.sha }}" \
            --to-environment production \
            --broker-base-url "$PACT_BROKER_BASE_URL" \
            --broker-token "$PACT_BROKER_TOKEN"

  record-deployment:
    runs-on: ubuntu-latest
    needs: can-i-deploy
    if: github.ref_name == 'main'
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pact-node CLI
        run: npm install -g @pact-foundation/pact-node

      - name: Record deployment
        run: |
          npx pact-broker record-deployment \
            --pacticipant "ing-payments-mobile-consumer" \
            --version "${{ github.sha }}" \
            --environment production \
            --broker-base-url "$PACT_BROKER_BASE_URL" \
            --broker-token "$PACT_BROKER_TOKEN"
